<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evliliğe Evet — Tek Form, Tüm Firmalar Ayağınıza Gelsin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Evliliğe <span>Evet</span></div>
    </div>
  </header>

  <main class="wrap">

    <section class="hero">
      <h1>Tek Form Doldurun,<br>Firmalar Size Ulaşsın</h1>
      <p>Düğününüz için ihtiyacınız olan hizmetleri seçin, size en yakın üye firmalara tek tıkla WhatsApp'tan ulaşın.</p>
    </section>

    <section class="form-card" id="formCard">
      <div class="field">
        <label>Hangi hizmetleri arıyorsunuz?</label>
        <div class="checkbox-row">
          <label class="check-pill">
            <input type="checkbox" name="cat" value="gelinlik" checked>
            <span>Gelinlik</span>
          </label>
          <label class="check-pill">
            <input type="checkbox" name="cat" value="makyaj" checked>
            <span>Makyaj</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="district">Hangi ilçedesiniz?</label>
        <select id="district">
          <option value="">İlçenizi seçin</option>
          <option>Çankaya</option>
          <option>Keçiören</option>
          <option>Yenimahalle</option>
          <option>Etimesgut</option>
          <option>Mamak</option>
          <option>Sincan</option>
          <option>Altındağ</option>
          <option>Pursaklar</option>
        </select>
      </div>

      <div class="field">
        <label for="weddingDate">Düğün tarihiniz (opsiyonel)</label>
        <input type="date" id="weddingDate">
      </div>

      <div class="field">
        <label for="budget">Bütçe aralığınız (opsiyonel)</label>
        <input type="text" id="budget" placeholder="Örn. 15.000 - 25.000 TL">
      </div>

      <button class="cta-btn" id="searchBtn">Uygun Firmaları Göster</button>
    </section>

    <section class="results" id="results" style="display:none;">
      <h2 id="resultsTitle">Sonuçlar</h2>
      <div id="resultsList"></div>
    </section>

  </main>

  <script src="js/firms-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
