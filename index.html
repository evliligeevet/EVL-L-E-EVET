<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evliliğe Evet — İlk Evet Dediğiniz An</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-center">
      <img src="img/logo.png" alt="Evliliğe Evet" class="logo-img">
      <p class="tagline">İlk Evet Dediğiniz An</p>
    </div>
    <a href="http://evliligeevetisortagim.site/" target="_blank" class="firma-giris-btn">Firma Girişi</a>
  </header>

  <main class="wrap">

    <section class="hero">
      <h1>Evliliğe Evet Demek İçin Yazmaya Başlayın,<br>Size En Yakın Firmaları Bulalım.</h1>
    </section>

    <section class="form-card" id="formCard">

      <div class="field">
        <label>Ne arıyorsunuz?</label>
        <input type="text" id="searchInput" placeholder="Örn: gelinlik, nikah, makyaj..." autocomplete="off">
        <div id="suggestions" class="suggestions"></div>
      </div>

      <div class="field" id="selectedField" style="display:none;">
        <label>Seçtikleriniz</label>
        <div id="selectedChips" class="selected-chips"></div>
      </div>

      <div id="budgetFields"></div>

      <div class="field-row">
        <div class="field">
          <label>Adınız Soyadınız</label>
          <input type="text" id="fullName" placeholder="Ad Soyad">
        </div>
        <div class="field">
          <label>Telefon Numaranız</label>
          <input type="text" id="phone" placeholder="05XX XXX XX XX">
        </div>
      </div>

      <div class="field">
        <label class="field-label-emphasis">Hangi ilçedesiniz?</label>
        <select id="district">
          <option value="">İlçenizi seçin</option>
          <option>Çankaya</option>
          <option>Keçiören</option>
          <option>Yenimahalle</option>
          <option>Etimesgut</option>
          <option>Mamak</option>
          <option>Sincan</option>
          <option>Altındağ</option>
          <option>Pursaklar</option>
          <option>Gölbaşı</option>
        </select>
      </div>

      <div class="field">
        <label>Düğün tarihiniz (opsiyonel)</label>
        <input type="date" id="weddingDate">
      </div>

      <button class="cta-btn" id="searchBtn">Uygun Firmaları Göster</button>
    </section>

    <section class="results" id="results" style="display:none;">
      <div id="resultsList"></div>
    </section>

  </main>

  <footer class="site-footer">Evliliğe Evet</footer>

  <script src="js/firms-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
